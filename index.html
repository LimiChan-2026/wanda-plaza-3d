<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>万达广场 · 3D 模型 | WANDA PLAZA 3D</title>
<style>
  :root{
    --bg:#0b1017; --panel:rgba(16,22,31,.82); --line:rgba(255,255,255,.10);
    --txt:#e8eef6; --dim:#93a3b5; --accent:#4ea1ff; --accent2:#ffd34d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);
    font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;color:var(--txt)}
  #scene{display:block;width:100vw;height:100vh}

  /* ---------- 加载页 ---------- */
  #loading{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;
    background:radial-gradient(circle at 50% 42%,#16283d 0%,#080c12 70%);transition:opacity .7s}
  #loading.hidden{opacity:0;pointer-events:none}
  .brand{display:flex;flex-direction:column;align-items:center;gap:10px}
  .brand .cn{font-size:42px;font-weight:700;letter-spacing:14px;
    text-shadow:0 0 26px rgba(78,161,255,.75)}
  .brand .en{font-size:12px;letter-spacing:6px;color:var(--dim)}
  .bar{width:230px;height:2px;background:rgba(255,255,255,.12);overflow:hidden;border-radius:2px}
  .bar i{display:block;height:100%;width:38%;background:linear-gradient(90deg,transparent,var(--accent),transparent);
    animation:slide 1.1s infinite}
  @keyframes slide{0%{transform:translateX(-120%)}100%{transform:translateX(360%)}}
  .tip{font-size:12px;color:var(--dim)}

  /* ---------- 顶部标题 ---------- */
  #hint{position:fixed;left:24px;top:20px;z-index:20;pointer-events:none}
  #hint h1{margin:0;font-size:20px;font-weight:700;letter-spacing:5px;
    text-shadow:0 2px 14px rgba(0,0,0,.85)}
  #hint p{margin:6px 0 0;font-size:11px;letter-spacing:2.4px;color:var(--dim)}

  /* ---------- 控制面板 ---------- */
  #ui{position:fixed;right:18px;top:18px;z-index:30;width:266px;padding:16px 16px 14px;
    background:var(--panel);backdrop-filter:blur(14px);border:1px solid var(--line);
    border-radius:14px;box-shadow:0 18px 48px rgba(0,0,0,.5);font-size:12.5px}
  #ui h2{margin:0 0 12px;font-size:12px;letter-spacing:3px;color:var(--dim);font-weight:600;
    display:flex;justify-content:space-between;align-items:center}
  #ui h2 span{color:var(--accent2);letter-spacing:1px}
  .sect{margin:14px 0 0;padding-top:12px;border-top:1px solid var(--line)}
  .sect:first-of-type{border-top:none;padding-top:0;margin-top:0}
  .lbl{font-size:10.5px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}

  #presets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  #presets button{padding:8px 0;border-radius:8px;border:1px solid var(--line);
    background:rgba(255,255,255,.04);color:var(--txt);cursor:pointer;font-size:12px;
    transition:.18s;font-family:inherit}
  #presets button:hover{background:rgba(78,161,255,.18);border-color:rgba(78,161,255,.5)}
  #presets button.active{background:rgba(78,161,255,.28);border-color:var(--accent);
    box-shadow:0 0 0 1px rgba(78,161,255,.4),0 0 18px rgba(78,161,255,.25)}

  input[type=range]{width:100%;-webkit-appearance:none;height:4px;border-radius:3px;
    background:linear-gradient(90deg,#1b2c44,#4ea1ff,#ffd34d,#1b2c44);outline:none;margin:2px 0}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
    border-radius:50%;background:#fff;border:3px solid var(--accent);cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.6)}
  .row{display:flex;justify-content:space-between;align-items:center;font-size:11.5px;
    color:var(--dim);margin:7px 0}
  .row b{color:var(--txt);font-weight:600}

  .toggles{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;margin-top:4px}
  .tg{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--dim);cursor:pointer;user-select:none}
  .tg input{appearance:none;width:30px;height:16px;border-radius:9px;background:rgba(255,255,255,.14);
    position:relative;cursor:pointer;transition:.2s;flex:none}
  .tg input:checked{background:var(--accent)}
  .tg input::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:#fff;transition:.2s}
  .tg input:checked::after{transform:translateX(14px)}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
  .actions button{padding:9px 0;border-radius:8px;border:1px solid var(--line);cursor:pointer;
    font-size:11.5px;font-family:inherit;color:var(--txt);background:rgba(255,255,255,.04);transition:.18s}
  .actions button:hover{background:rgba(78,161,255,.2);border-color:rgba(78,161,255,.5)}
  .actions button.primary{background:linear-gradient(135deg,#2b6fd0,#4ea1ff);border-color:transparent;
    font-weight:600;grid-column:span 2}
  .actions button.primary:hover{filter:brightness(1.12)}
  .actions button.active{background:rgba(255,211,77,.22);border-color:var(--accent2);color:var(--accent2)}
  .actions button:disabled{opacity:.6;cursor:default}

  .foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);
    font-size:10.5px;color:#5f6f82;line-height:1.7}
  #stats{position:fixed;left:24px;bottom:18px;z-index:20;font-size:10.5px;color:#63748a;
    letter-spacing:1px;pointer-events:none}
  @media (max-width:720px){#ui{width:calc(100vw - 24px);right:12px;top:auto;bottom:12px}
    #hint h1{font-size:15px}}
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="loading">
  <div class="brand">
    <div class="cn">万达广场</div>
    <div class="en">WANDA PLAZA · PROCEDURAL 3D MODEL</div>
  </div>
  <div class="bar"><i></i></div>
  <div class="tip">正在生成建筑体量 · 幕墙 · 场地 · 城市环境…</div>
</div>

<div id="hint">
  <h1>万达广场</h1>
  <p>WANDA PLAZA &nbsp;·&nbsp; 程序化 3D 建模 &nbsp;·&nbsp; 鼠标拖拽旋转 / 滚轮缩放</p>
</div>

<div id="ui">
  <h2>控制面板 <span id="hourLabel">15:30 · 昼</span></h2>

  <div class="sect">
    <div class="lbl">视角预设</div>
    <div id="presets"></div>
  </div>

  <div class="sect">
    <div class="lbl">时间 / 日照</div>
    <input id="hour" type="range" min="0" max="23.99" step="0.05" value="15.5">
    <div class="row"><span>00:00</span><span>12:00</span><span>24:00</span></div>
  </div>

  <div class="sect">
    <div class="lbl">显示选项</div>
    <div class="toggles">
      <label class="tg"><input type="checkbox" id="tg-rotate">自动旋转</label>
      <label class="tg"><input type="checkbox" id="tg-traffic" checked>车流</label>
      <label class="tg"><input type="checkbox" id="tg-crowd" checked>人群</label>
      <label class="tg"><input type="checkbox" id="tg-shadow" checked>阴影</label>
      <label class="tg"><input type="checkbox" id="tg-sky" checked>周边城市</label>
      <label class="tg"><input type="checkbox" id="tg-fog" checked>大气雾</label>
    </div>
  </div>

  <div class="sect">
    <div class="lbl">操作</div>
    <div class="actions">
      <button id="btn-timelapse">▶ 昼夜循环</button>
      <button id="btn-shot">📷 截图</button>
      <button id="btn-glb" class="primary">⬇ 导出 GLB 模型</button>
    </div>
  </div>

  <div class="foot">
    全部几何与贴图由代码程序化生成（无外部素材）<br>
    总建筑面积约 12 万 m² · 地上 4 层 · 中庭采光顶
  </div>
</div>

<div id="stats"></div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/BufferGeometryUtils.js"></script>
<script src="vendor/GLTFExporter.js"></script>
<script src="src/utils.js"></script>
<script src="src/mall.js"></script>
<script src="src/site.js"></script>
<script src="src/app.js"></script>

<script>
// 简易统计信息
setTimeout(() => {
  const el = document.getElementById('stats');
  if (!window.WANDA || !window.WANDA.scene) return;
  let meshes = 0, tris = 0;
  window.WANDA.scene.traverse(o => {
    if (o.isMesh && o.geometry) {
      meshes++;
      const g = o.geometry;
      tris += (g.index ? g.index.count : (g.attributes.position ? g.attributes.position.count : 0)) / 3;
    }
  });
  el.textContent = `模型统计：${meshes.toLocaleString()} 个构件 · ${Math.round(tris).toLocaleString()} 三角面 · three.js r${THREE.REVISION}`;
}, 2500);
</script>
</body>
</html>
